<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-ds-balance 的插件页图标：就是左边栏那个状态环（轨道 + 七成弧），等比放大。

    几何照 src/client/sidebar/PercentRing.tsx（viewBox 16 / 笔画 1 / 半径 6.5 / 中心 8），
    整组用 translate(18 18) scale(9/7) translate(-8 -8) 搬进 36 格：
    墨迹外径 14 放大成 18，外接框 9–27，四周各留 9（官方配方 8–9）。
    弧长 70%，dasharray 与组件在 ratio=0.7 时算出来的逐字相同；线帽照环用圆头。

    两处颜色都只能写死（宿主按图片渲染，currentColor 与主题变量都不起作用）：

    弧 #F59E0B：宿主那条 warn 档语义色（amber-500）的值，亮暗两块表逐字相同，
    也就是环在 warning 档画出来的颜色。

    轨道 #7F8287 + 45%：环的轨道用的是「跟随主题的半透明色」（亮 12% 黑 / 暗 16% 白），
    静态资源烘不了主题，所以取中性的 neutral-500（亮暗同值）加四成半不透明度 ——
    它落在白底上约等于亮档轨道的观感、落在深色底上约等于暗档的观感，两种主题都看得见，
    又明显比弧轻。

    注意：XML 注释里不许出现连续两个连字符，所以这里不写那几条 token 的原名 ——
    第一版就是这么坏掉的（浏览器当图片解析失败，插件页静默回落成默认图形）。
  -->
  <g transform="translate(18 18) scale(1.2857142857142858) translate(-8 -8)">
    <circle cx="8" cy="8" r="6.5" stroke="#7F8287" stroke-opacity="0.45" stroke-width="1" />
    <circle
      cx="8"
      cy="8"
      r="6.5"
      stroke="#F59E0B"
      stroke-width="1"
      stroke-linecap="round"
      stroke-dasharray="28.588 40.841"
      transform="rotate(-90 8 8)"
    />
  </g>
</svg>
