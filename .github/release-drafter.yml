# Release Drafter 配置：往一份草稿 Release 里追加内容，按 PR 标签分类。
#
# 它**不碰版本号、不打 tag、不发布** —— 发布决策权留给人。本仓的发布入口仍是
# .github/workflows/release.yml（手动 workflow_dispatch），两者互不替代。
#
# 用法与本仓现状见 docs/RELEASE-DRAFTER.md。

name-template: 'v$RESOLVED_VERSION'
# tag-template 刻意**不用** v$RESOLVED_VERSION：
# release.yml 用 `gh release view "$tag"` 判断该版本是否已发版，若草稿占了这个 tag，
# 判断会命中草稿并走「已存在，跳过」分支 —— 结果 npm 上发了、正式 Release 页面却查不到，
# 而且**不报错**。滚动名（next）永远不与 v<版本> 相撞。
tag-template: 'next'

categories:
  - title: 'Features'
    labels:
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'bug'
  - title: 'Compatibility'
    labels:
      - 'compat'
  - title: 'Refactoring'
    labels:
      - 'refactor'
  - title: 'Documentation'
    labels:
      - 'documentation'
  # 兜底：没打标签、或打了上表之外的标签，都落这里。
  - title: 'Other Changes'
    labels:
      - '*'
  # skip-changelog 在 pre-exclude 里生效，从所有分类里排除（见下）。
exclude-labels:
  - 'skip-changelog'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

# 依赖更新之类「合了但用户看不到」的改动不打标签，用 skip-changelog 排除。
pre-exclude:
  - title: 'skip-changelog'
    labels:
      - 'skip-changelog'

# 没有 PR 的直提（见 docs/RELEASE-DRAFTER.md）：草稿允许为空，不报错也不阻断。
autolabeler: []
template: |
  ## 变更摘要

  $CHANGES

  **由 Release Drafter 自动汇总草稿 —— 未发布。** 真正发布走
  `gh workflow run release.yml`（手动触发），正文以那一版的产物一致性复核为准。
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'compat'
  default: patch
# 本仓不按 PR 标题推版本号（版本由 npm version 显式 bump，见 docs/PUBLISHING.md），
# 解析结果仅供草稿标题显示用。
update-major-version: false
minor-version: true
patch-version: true
