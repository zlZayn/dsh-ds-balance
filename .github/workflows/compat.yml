# 兼容性巡检：每周把 @deepseek-ai/dsh-* 换到另一条 dist-tag 线上，看还构不构得出来。
#
# 为什么是每周而不是每次推送：它要重装整棵依赖树，跑一次几分钟，而宿主版本线一周也动不了几次。
#
# 两个作业，两件事，刻意分开：
#   declaration —— 只读 package.json 的声明区间 + 问 npm 该线实际指向的版本，
#                  判「我们声明的范围还罩不罩得住」。不装任何依赖，几十秒出结果。
#   swap        —— 真的换线、真的装、真的跑测试。
#   两者混在一起会互相遮蔽：声明面过期与代码真的跑不起来是两回事。
#
# 主次（2026-10-01 改）：**`next` 是承诺线** —— 它就是 RC 线（npm 上没有 `rc` 这个 tag，
# RC 版本全挂在 `next` 上）。`engines.dsh` 与全部 peer 的下限就写在 package.json 里、
# 落在这一条线上，宿主在跑的也是这条线。它红了就红、就修。
# **`alpha` 已停**：换线之后它是**我们已经不支持**的旧线（声明下限在它之上），
# 继续测等于测一个装不上的宿主。停它的理由与当初停 `next` 的理由同型，只是方向反了过来。
# 历史决策：.agents/notes/2026-09-20-compat-mainline.md（alpha 升为承诺线）
# 本次决策：.agents/notes/2026-10-01-track-rc-line.md
# **版本号不写在这里**（会漂，红线会红），要现查跑：node scripts/compat-swap.mjs check
#
# 「只记录」不等于「没人看」：任何一个作业红了都会开或更新**一条固定标题的跟踪 issue**
# （scripts/report-compat-failure.mjs，同一处失败不重复刷评论）—— 这就是
# 「不阻断」与「失败可见」并存。定时任务的失败邮件只发给最后改过 cron 的人，不能当主通知。
#
# 与 contract.yml 错开一小时，避免两个定时任务在同一分钟抢 runner。
name: compat

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # 失败可见要开 / 更新跟踪 issue。
  issues: write

jobs:
  # 声明面：只看 package.json 与 registry。**不装任何依赖**，所以也不挂 cache。
  declaration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # 判据：声明的区间必须能覆盖我们告诉用户去装的那条线（README 的「版本兼容」一节指名的那条）。
      - name: Check that the declaration covers the tracked line
        id: declaration
        run: node scripts/check-declaration.mjs

      - name: Record the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-compat-failure.mjs \
            --check declaration \
            --step "Check that the declaration covers the tracked line"

  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 承诺线（RC 族）：红了必须修。
          - line: next
            only: ''
            blocking: true
          # 声明面承诺的**第二族**（旧 RC 族，有真实使用者停在那里）：用**版本前缀**定位
          # （实测没有任何 dist-tag 指向它），并 `--only` 把声明面**临时收窄成只有这一族** ——
          # 并集区间会被 npm 解析成「装匹配集里最高的那族」，不收窄就装不到低族。
          # 只记录不阻断（continue-on-error 在作业级，见本 job 末尾），但它红要当回事。
          - line: 0.1.7-rc
            only: '--only 0.1.7-rc'
            blocking: false
    name: swap (${{ matrix.line }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # swap 内部先改写 package.json 的声明区间、跑裸 npm install，再跑 verify。
      # verify 不是陪衬：npm install 会假绿（失败但 node_modules 停在旧版本上），
      # 不回头确认实际装到了什么，后面的测试就跑在旧依赖上、给出与事实相反的信号。
      - name: Swap onto the ${{ matrix.line }} line and confirm what got installed
        id: swap
        # 记录线（声明面里承诺、但不是承诺线的那一族）红了**不阻断 run**，但换版失败同样要
        # 看得见 —— 阻断与否是「阻断 / 记录」的区别，不是「看得见 / 看不见」的区别。
        continue-on-error: ${{ !matrix.blocking }}
        run: node scripts/compat-swap.mjs swap --line ${{ matrix.line }} ${{ matrix.only }}

      - name: Typecheck
        id: typecheck
        continue-on-error: ${{ !matrix.blocking }}
        run: npm run typecheck

      - name: Test
        id: test
        continue-on-error: ${{ !matrix.blocking }}
        run: npm test

      # 作业级 continue-on-error 免掉的是「阻断」，不是「可见」：
      # 哪条线、红在哪一步都进跟踪 issue —— 但只报**承诺线**（记录线红了不追issue，见文件头）。
      - name: Record the failure on the tracking issue
        if: failure() && matrix.blocking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWAP_OUTCOME: ${{ steps.swap.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          node scripts/report-compat-failure.mjs \
            --check swap \
            --line "${{ matrix.line }}" \
            --step "swap=$SWAP_OUTCOME typecheck=$TYPECHECK_OUTCOME test=$TEST_OUTCOME"
